# Dokploy-deploy: docker compose up -d --build
#
# Routing (Mercantec — samme mønster som øvrige Mercantec-apps):
#   1. Cloudflare: *.mercantec.tech (wildcard CNAME → tunnel) + eval.mags.dk
#   2. Tunnel ingress: → http://localhost:80
#   3. Traefik (Dokploy): Host(`eval.mercantec.tech` | `eval.mags.dk`) → web:3000
#
# Kun frontend er eksponeret via Traefik. api + db er kun internt.
# Browser kalder /api/* → Next.js rewrite → http://api:3001/*
#
# Lokal udvikling med host-porte:
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up --build

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-evaluering}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-evaluering}
      POSTGRES_DB: ${POSTGRES_DB:-evaluering}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-evaluering} -d ${POSTGRES_DB:-evaluering}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://evaluering:evaluering@db:5432/evaluering?schema=public}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-use-long-random-string}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      API_PORT: ${API_PORT:-3001}
      SEED_TEACHER_EMAIL: ${SEED_TEACHER_EMAIL:-underviser@eval.local}
      SEED_TEACHER_PASSWORD: ${SEED_TEACHER_PASSWORD:-changeme123}
      SEED_TEACHER_NAME: ${SEED_TEACHER_NAME:-Demo Underviser}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_API_KEY: ${AI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://127.0.0.1:3001/health']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
        API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:3001}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:3001}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - dokploy-network
      - internal
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      # eval.mercantec.tech
      - traefik.http.routers.evaluering-mercantec.rule=Host(`eval.mercantec.tech`)
      - traefik.http.routers.evaluering-mercantec.entrypoints=web
      - traefik.http.routers.evaluering-mercantec.service=evaluering
      # eval.mags.dk
      - traefik.http.routers.evaluering-mags.rule=Host(`eval.mags.dk`)
      - traefik.http.routers.evaluering-mags.entrypoints=web
      - traefik.http.routers.evaluering-mags.service=evaluering
      - traefik.http.services.evaluering.loadbalancer.server.port=3000
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://127.0.0.1:3000/']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 25s

networks:
  dokploy-network:
    external: true
  internal:

volumes:
  postgres_data:
